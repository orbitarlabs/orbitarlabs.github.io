<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orbitaR</title>
<link rel="icon" href="assets/brand/icon-light.svg" type="image/svg+xml">
<meta name="description" content="orbitaR: quantum simulation, powered by Rust.">
<style>
:root{color-scheme:light dark;--bg:#f6f4ef;--ink:#2b1d31;--muted:#706675;--line:#d8d0d9}
@media (prefers-color-scheme:dark){:root{--bg:#241b2a;--ink:#f6f4ef;--muted:#b7a5bf;--line:#514458}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;padding:24px}
main{max-width:560px;text-align:center}
img{width:min(360px,80vw);height:auto}
p{color:var(--muted);font-size:17px;line-height:1.6;margin:18px 0}
a{color:inherit;text-underline-offset:4px}
.links{display:flex;gap:18px;justify-content:center;font-size:15px}
</style>
</head>
<body>
<main>
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="assets/brand/logo-dark.svg">
    <img src="assets/brand/logo-light.svg" alt="orbitaR">
  </picture>
  <p>Quantum simulation, powered by Rust. The site is on its way.</p>
  <div class="links"><a href="https://github.com/orbitarlabs/orbitaR">GitHub</a><a href="https://pypi.org/project/orbitar/">PyPI</a></div>
</main>
</body>
</html>
