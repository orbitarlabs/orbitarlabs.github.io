name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every local link and image resolves
        run: |
          status=0
          for f in $(find . -name '*.html' -not -path './.git/*'); do
            for ref in $(grep -oE '(src|href|srcset)="[^"#]+"' "$f" | sed -E 's/^[a-z]+="//; s/"$//'); do
              case "$ref" in http://*|https://*|mailto:*) continue;; esac
              [ -e "$(dirname "$f")/$ref" ] || { echo "$f: missing $ref"; status=1; }
            done
          done
          exit $status
      - name: The data comes from one named orbitaR commit
        run: test ! -e data/RESULTS.toml || grep -qE '^orbitarlabs/orbitaR [0-9a-f]{40}$' data/SOURCE
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
